name: Rocket.Chat Desktop App Release Action
description: Releases the Rocket.Chat Desktop app

inputs:
  ref:
    description: 'Forced ref to override github.context.payload.ref'
    required: false
  repository_owner:
    description: 'Owner of the repository where the release will be made'
    required: false
  repository_name:
    description: 'Name of the repository where the release will be made'
    required: false
  mac_csc_link:
    description: 'The base64-encoded data of certificates (*.p12) for code signing for macOS'
    required: true
  mac_csc_key_password:
    description: 'The password to decrypt the certificates for code signing for macOS'
    required: true
  mac_apple_id:
    description: 'The Apple ID for notarization'
    required: true
  mac_apple_id_password:
    description: 'The password associated to Apple ID for notarization'
    required: true
  mac_asc_provider:
    description: 'The membership account associated with the Apple Developer account'
    required: true
  gcp_sa_json:
    description: 'Google Cloud service account JSON for KMS authentication'
    required: true
  win_kms_key_resource:
    description: 'Google Cloud KMS key resource (projects/.../locations/.../keyRings/.../cryptoKeys/.../cryptoKeyVersions/N)'
    required: true
  win_kms_cert_sha1:
    description: 'SHA1 thumbprint of the issued code signing certificate (optional if win_user_crt provided)'
    required: false
  win_kms_csp:
    description: 'CSP name (default: Google Cloud KMS Provider)'
    required: false
  win_timestamp_url:
    description: 'RFC3161 timestamp URL (default: http://timestamp.digicert.com)'
    required: false
  win_user_crt:
    description: 'PEM content of issued code signing certificate'
    required: false
  win_intermediate_crt:
    description: 'PEM content of intermediate CA certificate'
    required: false
  win_root_crt:
    description: 'PEM content of root CA certificate'
    required: false
  github_token:
    description: 'The GitHub token to publish releases'
    required: true
  snapcraft_token:
    description: 'The Snapcraft token to publish releases'
    required: true
  mode:
    description: >-
      build (default): pack the given targets and upload them to the tagged draft release.
      prepare: only create/find the draft release for the tag, so parallel build jobs never race on it.
      dry-run: pack and sign/verify the given targets, never touch GitHub releases or Snapcraft
      (usable from workflow_dispatch on a branch).
    required: false
    default: 'build'
  targets:
    description: >-
      Space-separated electron-builder targets for this job, e.g. "nsis", "msi", "appx",
      "dmg zip pkg", "mas", "AppImage deb rpm tar.gz", "snap". Empty = every target for the platform
      (the pre-split behaviour).
    required: false
    default: ''
  upload_update_metadata:
    description: >-
      Whether this job uploads the electron-updater metadata files (latest*.yml, alpha*.yml,
      beta*.yml). Exactly ONE job per platform must be true: the one that builds the artifact the
      updater consumes (nsis on Windows, dmg+zip on macOS, AppImage on Linux). Other jobs would
      overwrite it with a partial file list.
    required: false
    default: 'true'

runs:
  using: 'node24'
  main: 'dist/index.js'
