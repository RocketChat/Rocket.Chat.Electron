name: Bug report
title: 'Bug title'
description: Report issues with Rocket.Chat Desktop App
labels: ['type: bug']
body:
  - type: markdown
    attributes:
      value: >
        - Please make sure what you are reporting is indeed a bug with reproducible steps

        - If you want to ask questions or share ideas, you can,
          -  Head to our [Forums](https://forums.rocket.chat) Page
          - [Join our Open Server]( https://open.rocket.chat/channel/support) and send your question

        For better global communication, English is the language used.

        Attach a [Log Viewer](https://github.com/RocketChat/Rocket.Chat.Electron/blob/dev/docs/troubleshooting.md)
        export when possible (**Help → Open Log Viewer**).

  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please make sure to search in the existing [issues](https://github.com/RocketChat/Rocket.Chat.Electron/issues?q=is%3Aissue)
        first to see whether the same issue was reported already.
      options:
        - label: >
            I had searched in the [issues](https://github.com/RocketChat/Rocket.Chat.Electron/issues?q=is%3Aissue) and found
            no similar issues.
          required: true

  - type: checkboxes
    attributes:
      label: Operating System
      description: >
        Please select in which operating system you found the issue.
      options:
        - label: macOS
        - label: Windows
        - label: Linux
    validations:
      required: true

  - type: input
    attributes:
      label: Operating System Version
      description: >
        Please specify the version of the operating system.
        Desktop requires macOS 12+, Windows 10+, or Ubuntu 22.04+ (or equivalent).
      placeholder: macOS 14+, Windows 11, Ubuntu 22.04

  - type: dropdown
    id: install-type
    attributes:
      label: Installation type
      description: >
        Where the app was installed from. Updates differ by source
        (see [How updates work by install source](https://github.com/RocketChat/Rocket.Chat.Electron/blob/dev/README.md#how-updates-work-by-install-source)).
      options:
        - Mac App Store
        - Microsoft Store (AppX)
        - MSI
        - NSIS (.exe)
        - Snap
        - AppImage
        - DMG / PKG (GitHub)
        - deb / rpm
        - Other / unknown
    validations:
      required: true

  - type: dropdown
    id: browser-tested
    attributes:
      label: It happens on the web browser too?
      description: >
        Please test if the issue happens on the web browser too. It's very important to understand if the issue is related to the desktop app or the web app.
      options:
        - 'Yes, it happens on the web browser too'
        - 'No, it just happens on the Desktop app'
    validations:
      required: true

  - type: input
    attributes:
      label: Rocket.Chat Desktop App Version
      description: >
        Please specify the version of the Rocket.Chat Desktop App
        (Help → About). Latest stable is 4.16.x.
      placeholder: 4.16.x
    validations:
      required: true

  - type: input
    attributes:
      label: Rocket.Chat Server Version
      description: >
        Please specify the version of the connected Rocket.Chat
        [workspace](https://github.com/RocketChat/Rocket.Chat/releases)
        (`<your server>/api/info`). Desktop compatibility is that of the
        connected workspace.
      placeholder: 7.x
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the bug
      description: |
        Please provide the context in which the problem occurred and explain what happened
        Is there any setting relevant to the problem that changed?
      placeholder: A clear and concise description of what the bug is
    validations:
      required: true

  - type: textarea
    attributes:
      label: How to Reproduce
      description: |
        Explain the steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
      placeholder: >
        Please make sure you provide a reproducible step-by-step case of how to reproduce the problem
        as minimally and precisely as possible. Screenshots are welcome.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe your Expected behavior
      description: >
        - Please explain why you think the behavior is erroneous.

        - It will be extremely helpful if you copy and paste
          screenshots for UI problems
      placeholder: A clear and concise description of what you expected to happen.

  - type: textarea
    id: log-viewer-export
    attributes:
      label: Log Viewer export
      description: |
        Open **Help → Open Log Viewer**, reproduce the issue, then use
        **Copy** or **Save**. See [docs/troubleshooting.md](https://github.com/RocketChat/Rocket.Chat.Electron/blob/dev/docs/troubleshooting.md)
        for paths if the viewer is unavailable.

        Paste here inside a fenced block, or wrap a long dump in
        `<details><summary>logs</summary> … </details>`.
      placeholder: Paste Log Viewer export or main.log excerpt

  - type: textarea
    attributes:
      label: Anything else
      description: |
        1. How often does this problem occur?
            - Once?
            - Every time?
            - Only when certain conditions are met?
        2. Any other context (workspace URL redacted, screen recordings, etc.)
      placeholder: Anything else we need to know?

  - type: checkboxes
    attributes:
      label: Are you willing to submit a code contribution?
      description: |
        - We would be happy to guide you in the contribution process especially if you already have a good understanding of how to implement the fix.
      options:
        - label: Yes, I am willing to submit a Pull Request!
