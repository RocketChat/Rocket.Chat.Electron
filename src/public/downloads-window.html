<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Downloads - Rocket.Chat</title>
    <link rel="stylesheet" href="./main.css" />
    <style>
      :root {
        /* Lets Chromium paint the base canvas in the OS appearance, so an
           opaque window does not flash white before the palette mounts. */
        color-scheme: light dark;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
          'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',
          'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Stays transparent until the app resolves the window material, so a
           vibrant window never flashes an opaque backdrop on first paint. */
        background-color: transparent;
      }

      #root {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
    <link rel="stylesheet" href="./icons/rocketchat.css" />
  </head>

  <body>
    <div id="root"></div>
    <script src="./downloads-window.js"></script>
  </body>
</html>
